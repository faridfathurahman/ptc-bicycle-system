name: Check Bicycle Overdue

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Run overdue checker
        run: |
          curl -X GET https://ptc-bicycle-system.netlify.app/.netlify/functions/check-overdue
